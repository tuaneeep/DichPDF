[project]
name = "retain-pdf-backend"
version = "4.1.0-beta8"
description = "Retain PDF backend pipeline dependencies and tooling"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "openxlab==0.1.2",
  "Pillow==10.4.0",
  "pydantic==2.11.7",
  "PyMuPDF==1.26.5",
  "python-multipart==0.0.20",
  "requests==2.28.2",
  "urllib3==1.26.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[tool.retain_pdf.external-binaries]
required = ["typst"]
optional = ["gs"]
