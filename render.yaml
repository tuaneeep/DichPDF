services:
  - type: web
    name: eeep-pdf-translator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: MINERU_AK
        sync: false
      - key: MINERU_SK
        sync: false
      - key: GROQ_API_KEY
        sync: false
